[package]
name = "sensorium-audio"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "NIH-Plug based audio engine with VST3/CLAP/Standalone support"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nih_plug = { workspace = true, features = ["vst3", "standalone"] }
nih_plug_derive = { workspace = true }
nih_plug_vizia = { workspace = true }
fundsp = "0.11"
rubato = "0.16"
cpal = { workspace = true }
ringbuf = { workspace = true }
midly = { workspace = true }
midir = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
parking_lot = { workspace = true }
crossbeam = { workspace = true }
slotmap = { workspace = true }
bumpalo = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
nih_plug = { workspace = true, features = ["vst3", "standalone"] }
nih_plug_derive = { workspace = true }
criterion = { workspace = true }
proptest = { workspace = true }
quickcheck = { workspace = true }

[[bench]]
name = "audio_dsp"
harness = false

