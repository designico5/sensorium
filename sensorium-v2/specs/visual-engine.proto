syntax = "proto3";

package sensorium.visual;

message RenderCommand {
  oneof payload {
    DrawRect rect = 1;
    DrawText text = 2;
    DrawNode node = 3;
  }
}

message DrawRect {
  float x = 1;
  float y = 2;
  float width = 3;
  float height = 4;
  float r = 5;
  float g = 6;
  float b = 7;
  float a = 8;
}

message DrawText {
  string text = 1;
  float x = 2;
  float y = 3;
  float size = 4;
  float r = 5;
  float g = 6;
  float b = 7;
  float a = 8;
}

message DrawNode {
  uint32 id = 1;
  repeated float transform = 2; // 4x4 matrix flattened
  repeated RenderCommand children = 3;
}

message GpuBuffer {
  bytes data = 1;
  uint32 stride = 2;
  uint32 count = 3;
}