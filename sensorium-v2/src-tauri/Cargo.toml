[package]
name = "sensorium-v2-tauri"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Tauri 2.0 desktop shell for Sensorium v2"

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Sensorium backend crates
sensorium-audio = { path = "../crates/sensorium-audio" }
sensorium-midi = { path = "../crates/sensorium-midi" }
sensorium-sync = { path = "../crates/sensorium-sync" }
sensorium-visual = { path = "../crates/sensorium-visual" }
sensorium-ai = { path = "../crates/sensorium-ai" }
sensorium-chaos = { path = "../crates/sensorium-chaos" }
sensorium-contracts = { path = "../crates/sensorium-contracts" }