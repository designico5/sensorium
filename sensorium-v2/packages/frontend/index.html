<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Sensorium V2 — Zero-Latency Audio Engine with MIDI 2.0, WebGPU Visuals, and AI Co-Pilot" />
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="color-scheme" content="dark" />
    <title>Sensorium V2 — Professional Audio Engine</title>

    <!-- Preconnect for fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <style>
      /* Critical CSS — prevents flash of unstyled content */
      html, body, #root {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #0a0a0f;
        color: rgba(255, 255, 255, 0.95);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      }

      /* Loading spinner */
      .sensorium-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #0a0a0f;
        z-index: 9999;
      }
      .sensorium-loader .ring {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 3px solid transparent;
        border-top-color: #5ac8fa;
        border-right-color: #af52de;
        animation: spin 1s linear infinite;
      }
      .sensorium-loader .text {
        font-size: 11px;
        letter-spacing: 4px;
        text-transform: uppercase;
        color: rgba(255,255,255,0.4);
        font-family: 'JetBrains Mono', monospace;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      /* Accessibility: skip link */
      .skip-link {
        position: absolute;
        top: -40px;
        left: 0;
        background: #5ac8fa;
        color: #000;
        padding: 8px 16px;
        text-decoration: none;
        z-index: 100;
        font-weight: 600;
        border-radius: 0 4px 4px 0;
      }
      .skip-link:focus {
        top: 0;
      }

      /* Respect motion preferences */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <a href="#root" class="skip-link">Skip to content</a>
    <div id="root">
      <div class="sensorium-loader">
        <div class="ring"></div>
        <div class="text">Sensorium</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
