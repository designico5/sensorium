name: Verify Gate
on:
  pull_request:
    branches: [master, main, develop]
  push:
    branches: [master, main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  stage-matrix:
    name: Stage Matrix Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate physical-stage matrix coverage
        run: node --test tests/stage-matrix-policy.test.mjs tests/stage-evidence-schema.test.mjs

  rust-check:
    name: Rust Workspace Check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "sensorium-v2 -> target"
      - name: Cargo Check
        working-directory: sensorium-v2
        run: cargo check --workspace
      - name: Cargo Clippy
        working-directory: sensorium-v2
        run: cargo clippy --workspace -- -D warnings

  rust-test:
    name: Rust Tests
    runs-on: windows-latest
    needs: rust-check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "sensorium-v2 -> target"
      - name: Run Tests
        working-directory: sensorium-v2
        run: cargo test --workspace

  rust-realtime-safety:
    name: MIDI and Audio Safety Crates
    runs-on: windows-latest
    needs: stage-matrix
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "sensorium-v2 -> target"
      - name: Test bounded MIDI and audio contracts
        working-directory: sensorium-v2
        run: cargo test -p sensorium-midi -p sensorium-audio -p sensorium-contracts --lib

  parser-fuzz:
    name: UMP Parser Fuzz Smoke Run
    runs-on: ubuntu-latest
    needs: stage-matrix
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz UMP parser with bounded budget
        working-directory: sensorium-v2/fuzz
        run: cargo fuzz run ump_parser -- -runs=10000 -max_total_time=30

  release-contracts:
    name: Release Manifest Contract
    runs-on: windows-latest
    needs: stage-matrix
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "sensorium-v2 -> target"
      - name: Reject incomplete or unsigned manifests
        working-directory: sensorium-v2
        run: cargo test -p sensorium-release --lib

  sync-snapshot-contracts:
    name: Sync Snapshot Migration Contract
    runs-on: windows-latest
    needs: stage-matrix
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "sensorium-v2 -> target"
      - name: Verify versioned snapshots and legacy migration
        working-directory: sensorium-v2
        run: cargo test -p sensorium-sync --lib

  rust-build:
    name: Rust Release Build
    runs-on: windows-latest
    needs: rust-check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "sensorium-v2 -> target"
      - name: Release Build
        working-directory: sensorium-v2
        run: cargo build --workspace --release

  frontend-check:
    name: Frontend Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  v2-frontend-check:
    name: Sensorium V2 Frontend
    runs-on: ubuntu-latest
    needs: stage-matrix
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: sensorium-v2/package-lock.json
      - run: npm ci
        working-directory: sensorium-v2
      - run: npm --workspace @sensorium/frontend run build
        working-directory: sensorium-v2
      - run: npm --workspace @sensorium/frontend test
        working-directory: sensorium-v2
      - name: Install Chromium for browser E2E
        working-directory: sensorium-v2/packages/frontend
        run: npx playwright install --with-deps chromium
      - run: npm --workspace @sensorium/frontend run test:e2e
        working-directory: sensorium-v2

  mobile-preview-check:
    name: MA-II-MI Mobile Preview
    runs-on: ubuntu-latest
    needs: stage-matrix
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: sensorium-v2/apps/ma-ii-mi-prototype/package-lock.json
      - run: npm ci
        working-directory: sensorium-v2/apps/ma-ii-mi-prototype
      - run: npm run check:runtime
        working-directory: sensorium-v2/apps/ma-ii-mi-prototype
      - run: npm run build
        working-directory: sensorium-v2/apps/ma-ii-mi-prototype
      - run: npm run test:sites
        working-directory: sensorium-v2/apps/ma-ii-mi-prototype

  android-native-check:
    name: MA-II-MI Android Native
    runs-on: ubuntu-latest
    needs: stage-matrix
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Install Android compile SDK
        run: sdkmanager "platforms;android-37"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Android unit tests, lint, and debug build
        working-directory: sensorium-v2/apps/ma-ii-mi-android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Run Audit
        working-directory: sensorium-v2
        run: cargo audit
