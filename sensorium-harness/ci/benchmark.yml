name: Benchmark Gate
on:
  pull_request:
  push:
    branches: [main]

jobs:
  audio-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Audio Benchmarks
        run: cargo bench --package sensorium-audio -- --save-baseline pr-${{ github.event.pull_request.number }}
      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: audio-bench-results
          path: target/criterion/

  midi-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run MIDI Benchmarks
        run: cargo bench --package sensorium-midi -- --save-baseline pr-${{ github.event.pull_request.number }}
      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: midi-bench-results
          path: target/criterion/

  regression-check:
    runs-on: ubuntu-latest
    needs: [audio-bench, midi-bench]
    steps:
      - uses: actions/checkout@v4
      - name: Check for Regressions
        run: |
          cargo bench --package sensorium-audio -- --baseline main
          cargo bench --package sensorium-midi -- --baseline main