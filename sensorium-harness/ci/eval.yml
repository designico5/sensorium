name: Eval Gate
on:
  workflow_dispatch:
    inputs:
      gate:
        type: choice
        options: [M1, M2, M3, M4, M5, M6, M7]
  push:
    branches: [main]

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Capability Evals
        run: ./hooks/eval-runner.sh ${{ github.event.inputs.gate || 'M1' }} capability
      - name: Run Regression Evals
        run: ./hooks/eval-runner.sh ${{ github.event.inputs.gate || 'M1' }} regression
      - name: Generate Report
        run: ./hooks/eval-runner.sh ${{ github.event.inputs.gate || 'M1' }} report
      - name: Pass/Fail Gate
        run: |
          REPORT=eval-reports/${{ github.event.inputs.gate || 'M1' }}/report.json
          if [ -f "$REPORT" ]; then
            echo "Eval report generated."
            # In production: parse pass@k and fail if < threshold
          fi