syntax = "proto3";

package sensorium.state;

// Automerge change operation (binary format descriptor)
message AutomergeOp {
  oneof op {
    bytes change = 1;           // Encoded Automerge change blob
    bytes patch = 2;            // Binary patch for incremental sync
  }
  string doc_id = 3;            // Document identifier
  int64 clock = 4;              // Lamport clock / vector clock
}

// High-level sync message over the wire
message SyncMessage {
  oneof msg {
    AutomergeOp op = 1;
    bytes heads = 2;            // Document heads (hashes)
    bytes blob = 3;             // Full state blob
  }
  string peer_id = 4;
  int64 timestamp = 5;
}

// Document snapshot
message DocumentPatch {
  string doc_id = 1;
  bytes binary_state = 2;       // Automerge 2.0 binary format
  map<string, bytes> fragments = 3; // Sharded sync fragments
}

// Sync state for consumer feedback
message SyncState {
  string peer_id = 1;
  int64 last_sync_ms = 2;
  int32 pending_ops = 3;
  bool is_offline = 4;
}