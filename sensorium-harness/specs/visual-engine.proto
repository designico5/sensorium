syntax = "proto3";

package sensorium.visual;

// Render command for instanced rendering pipeline
message RenderCommand {
  oneof cmd {
    DrawInstanced instanced = 1;
    ComputeDispatch compute = 2;
    ClearBuffers clear = 3;
  }
  int64 frame_id = 4;
  int64 timestamp_ns = 5;
}

message DrawInstanced {
  int32 pipeline_id = 1;
  int32 vertex_buffer_id = 2;
  int32 instance_count = 3;
  int32 first_instance = 4;
  repeated float transform = 5; // 4x4 matrix flattened (16 floats)
}

message ComputeDispatch {
  int32 pipeline_id = 1;
  int32 workgroup_count_x = 2;
  int32 workgroup_count_y = 3;
  int32 workgroup_count_z = 4;
  repeated float params = 5;   // Uniforms / push constants
}

message ClearBuffers {
  repeated int32 attachment_ids = 1;
  float r = 2;
  float g = 3;
  float b = 4;
  float a = 5;
}

// GPU buffer handle for zero-copy sharing
message GPUBuffer {
  int32 id = 1;
  int32 size_bytes = 2;
  BufferUsage usage = 3;
  bool is_mapped = 4;
}

enum BufferUsage {
  UNKNOWN = 0;
  VERTEX = 1;
  INDEX = 2;
  UNIFORM = 3;
  STORAGE_READ = 4;
  STORAGE_READ_WRITE = 5;
  MAP_READ = 6;
  MAP_WRITE = 7;
}

// Frame timing for latency budget enforcement
message FrameTiming {
  int64 frame_id = 1;
  int64 gpu_start_ns = 2;
  int64 gpu_end_ns = 3;
  int64 present_ns = 4;
  float cpu_time_ms = 5;
  float gpu_time_ms = 6;
}